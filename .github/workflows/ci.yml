name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un commit nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FITNESS_TRACKER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitness_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

  # Estos pasos se activan solos cuando existen los archivos de despliegue
  # (Dockerfile y deploy/), así el mismo workflow vale antes y después de
  # incorporarlos.
  deploy-files:
    name: imagen Docker y scripts de despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Analizar los scripts con ShellCheck
        if: ${{ hashFiles('deploy/*.sh') != '' }}
        run: shellcheck deploy/*.sh

      - name: Validar docker-compose.yml
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: |
          cp .env.example .env
          sed -i 's/^FITNESS_TRACKER_JWT_SECRET=$/FITNESS_TRACKER_JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret/' .env
          docker compose config --quiet

      - name: Construir la imagen
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build -t fitness-tracker:ci .

      - name: Arrancar el contenedor y comprobar /health
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker run -d --name app --network host \
            -e FITNESS_TRACKER_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/fitness_smoke \
            -e FITNESS_TRACKER_JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            fitness-tracker:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

  # Un único resultado estable para exigirlo en la protección de la rama.
  ci:
    name: ci
    needs: [tests, deploy-files]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Alguna comprobación ha fallado."
            exit 1
          fi
